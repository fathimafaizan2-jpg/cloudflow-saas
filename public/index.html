<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflow | Instagram Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="container mx-auto px-4 py-10 max-w-4xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold text-purple-500">Cloudflow</h1>
            <button id="logoutBtn" class="hidden bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Logout</button>
        </header>

        <!-- Auth Section -->
        <section id="authSection" class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-md mx-auto">
            <div id="loginForm">
                <h2 class="text-xl mb-6 font-semibold">Login to Cloudflow</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-purple-500">
                <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-purple-500">
                <button onclick="login()" class="w-full bg-purple-600 hover:bg-purple-700 p-3 rounded font-bold transition">Login</button>
                <p class="mt-4 text-sm text-gray-400 text-center">Don't have an account? <a href="#" onclick="toggleAuth()" class="text-purple-400">Sign Up</a></p>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboardSection" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Sidebar: Accounts -->
                <div class="bg-gray-800 p-6 rounded-lg h-fit">
                    <h2 class="text-lg font-bold mb-4 border-b border-gray-700 pb-2">Connected Accounts</h2>
                    <div id="accountsList" class="space-y-3"></div>
                    <button onclick="connectInstagram()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 p-2 rounded text-sm font-bold">Connect Instagram</button>
                </div>

                <!-- Main: Posts & Rules -->
                <div class="md:col-span-2 space-y-6">
                    <div class="bg-gray-800 p-6 rounded-lg">
                        <h2 class="text-lg font-bold mb-4">Create Automation Rule</h2>
                        <div class="space-y-4">
                            <input type="text" id="mediaId" placeholder="Instagram Media ID" class="w-full p-2 bg-gray-700 rounded border border-gray-600">
                            <input type="text" id="keyword" placeholder="Keyword (e.g. LINK)" class="w-full p-2 bg-gray-700 rounded border border-gray-600">
                            <textarea id="responseText" placeholder="Automated Response Message" class="w-full p-2 bg-gray-700 rounded border border-gray-600 h-24"></textarea>
                            <button onclick="saveRule()" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded font-bold">Save Rule</button>
                        </div>
                    </div>

                    <div class="bg-gray-800 p-6 rounded-lg">
                        <h2 class="text-lg font-bold mb-4">Active Rules</h2>
                        <div id="rulesList" class="space-y-4 text-sm"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let token = localStorage.getItem('token');

        async function apiFetch(path, options = {}) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const res = await fetch(path, { ...options, headers });
            if (res.status === 401 || res.status === 403) logout();
            return res.json();
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const data = await apiFetch('/api/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });
            if (data.token) {
                token = data.token;
                localStorage.setItem('token', token);
                showDashboard();
            } else {
                alert(data.error || 'Login failed');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }

        function connectInstagram() {
            window.location.href = `/api/auth/instagram?token=${token}`;
        }

        async function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            loadData();
        }

        async function loadData() {
            const { accounts } = await apiFetch('/api/instagram/accounts');
            const { postRules } = await apiFetch('/api/dashboard-data');
            
            const accList = document.getElementById('accountsList');
            accList.innerHTML = accounts.map(a => `<div class="p-2 bg-gray-700 rounded text-xs">${a.name}</div>`).join('');

            const rList = document.getElementById('rulesList');
            rList.innerHTML = Object.values(postRules).map(r => `
                <div class="p-3 bg-gray-700 rounded flex justify-between items-center">
                    <div>
                        <span class="text-purple-400 font-bold">#${r.keyword}</span> 
                        <p class="text-gray-300 mt-1">${r.responseText}</p>
                        <p class="text-[10px] text-gray-500 mt-1">Media ID: ${r.mediaId}</p>
                    </div>
                </div>
            `).join('');
        }

        async function saveRule() {
            const mediaId = document.getElementById('mediaId').value;
            const keyword = document.getElementById('keyword').value;
            const responseText = document.getElementById('responseText').value;
            await apiFetch('/api/rules/post', {
                method: 'POST',
                body: JSON.stringify({ mediaId, keyword, responseText })
            });
            loadData();
        }

        if (token) showDashboard();
        document.getElementById('logoutBtn').onclick = logout;
    </script>
</body>
</html>
